name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Install MinGW (Windows target only)
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Download Npcap SDK (Windows target only)
        if: matrix.goos == 'windows'
        env:
          NPCAP_SDK_VERSION: "1.13"
          NPCAP_SDK_SHA256: "dad1f2bf1b02b787be08ca4862f99e39a876c1f274bac4ac0cedc9bbc58f94fd"
        run: |
          curl -fsSL -o npcap-sdk.zip "https://npcap.com/dist/npcap-sdk-${NPCAP_SDK_VERSION}.zip"
          echo "${NPCAP_SDK_SHA256}  npcap-sdk.zip" | sha256sum -c -
          unzip -q npcap-sdk.zip -d npcap-sdk

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
            export CGO_ENABLED=1
            export CC=x86_64-w64-mingw32-gcc
            export CGO_CFLAGS="-I$(pwd)/npcap-sdk/Include"
            export CGO_LDFLAGS="-L$(pwd)/npcap-sdk/Lib/x64"
          else
            EXT=""
            export CGO_ENABLED=0
          fi
          go build -ldflags="-s -w -X github.com/pbuller/dhcp-probe/cmd.Version=${{ github.ref_name }}" -o dhcp-probe-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} .

      - name: Upload build artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: dhcp-probe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dhcp-probe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download amd64 artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dhcp-probe-linux-amd64
          path: dist/release

      - name: Download arm64 artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dhcp-probe-linux-arm64
          path: dist/release

      - name: Download windows-amd64 artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dhcp-probe-windows-amd64
          path: dist/release

      - name: Create release and upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API_BASE="${SERVER_URL}/api/v1"

          # Try to get existing release by tag (404 is expected if it doesn't exist yet)
          RELEASE=$(curl -sf "${API_BASE}/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITHUB_TOKEN}" || true)
          RELEASE_ID=$(echo "$RELEASE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)

          # Create release if it doesn't exist yet
          if [ -z "$RELEASE_ID" ]; then
            HTTP_CODE=$(curl -s -o /tmp/release_response.json -w "%{http_code}" -X POST \
              "${API_BASE}/repos/${REPO}/releases" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"${TAG}\", \"name\": \"${TAG}\"}")
            [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || { echo "ERROR: POST failed (HTTP ${HTTP_CODE}): $(cat /tmp/release_response.json)"; exit 1; }
            RELEASE=$(cat /tmp/release_response.json)
            RELEASE_ID=$(echo "$RELEASE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: could not get or create release for tag ${TAG}"
            echo "Response: ${RELEASE}"
            exit 1
          fi

          echo "Release ID: ${RELEASE_ID}"

          # Upload each binary
          for f in dist/release/*; do
            echo "Uploading $(basename "${f}")..."
            curl -sfS -X POST "${API_BASE}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "${f}")" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}"
          done

  mirror-github-release:
    needs: [build, release]
    runs-on: ubuntu
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download amd64 artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dhcp-probe-linux-amd64
          path: dist/release

      - name: Download arm64 artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dhcp-probe-linux-arm64
          path: dist/release

      - name: Download windows-amd64 artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dhcp-probe-windows-amd64
          path: dist/release

      - name: Create GitHub release and upload binaries
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GH_REPO: pbuller/dhcp-probe
        run: |
          set -euo pipefail

          if [ -z "${GH_RELEASE_TOKEN:-}" ]; then
            echo "ERROR: secrets.GH_RELEASE_TOKEN is not set; cannot mirror release to GitHub."
            exit 1
          fi

          GH_API="https://api.github.com"
          AUTH_HEADER="Authorization: Bearer ${GH_RELEASE_TOKEN}"

          # Pull the notes/body from the Forgejo release we just created, so
          # GitHub gets the same title and notes rather than a bare tag name.
          FORGEJO_RELEASE=$(curl -sf "${SERVER_URL}/api/v1/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITHUB_TOKEN}")
          RELEASE_NAME=$(echo "$FORGEJO_RELEASE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name") or "")')
          RELEASE_BODY=$(echo "$FORGEJO_RELEASE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body") or "")')
          [ -n "$RELEASE_NAME" ] || RELEASE_NAME="${TAG}"

          # Idempotency: look up by tag first, in case this step re-runs.
          HTTP_CODE=$(curl -s -o /tmp/gh_release_lookup.json -w "%{http_code}" \
            "${GH_API}/repos/${GH_REPO}/releases/tags/${TAG}" \
            -H "${AUTH_HEADER}" \
            -H "Accept: application/vnd.github+json")

          if [ "$HTTP_CODE" -eq 200 ]; then
            GH_RELEASE_ID=$(python3 -c 'import json; print(json.load(open("/tmp/gh_release_lookup.json"))["id"])')
            UPLOAD_URL="${GH_API}/repos/${GH_REPO}/releases/${GH_RELEASE_ID}/assets"
          elif [ "$HTTP_CODE" -eq 404 ]; then
            PAYLOAD=$(RELEASE_NAME="$RELEASE_NAME" RELEASE_BODY="$RELEASE_BODY" TAG="$TAG" \
              python3 -c 'import json,os; print(json.dumps({"tag_name": os.environ["TAG"], "name": os.environ["RELEASE_NAME"], "body": os.environ["RELEASE_BODY"]}))')
            HTTP_CODE=$(curl -s -o /tmp/gh_release_create.json -w "%{http_code}" -X POST \
              "${GH_API}/repos/${GH_REPO}/releases" \
              -H "${AUTH_HEADER}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}")
            [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || { echo "ERROR: GitHub release POST failed (HTTP ${HTTP_CODE}): $(cat /tmp/gh_release_create.json)"; exit 1; }
            GH_RELEASE_ID=$(python3 -c 'import json; print(json.load(open("/tmp/gh_release_create.json"))["id"])')
            UPLOAD_URL="${GH_API}/repos/${GH_REPO}/releases/${GH_RELEASE_ID}/assets"
          else
            echo "ERROR: unexpected HTTP ${HTTP_CODE} looking up GitHub release for tag ${TAG}: $(cat /tmp/gh_release_lookup.json)"
            exit 1
          fi

          echo "GitHub release ID: ${GH_RELEASE_ID}"

          # Fetch existing asset names so re-runs don't fail on duplicates.
          EXISTING_ASSETS=$(curl -sf "${GH_API}/repos/${GH_REPO}/releases/${GH_RELEASE_ID}/assets" \
            -H "${AUTH_HEADER}" -H "Accept: application/vnd.github+json" \
            | python3 -c 'import json,sys; print("\n".join(a["name"] for a in json.load(sys.stdin)))')

          for f in dist/release/*; do
            NAME=$(basename "${f}")
            if echo "$EXISTING_ASSETS" | grep -qx "$NAME"; then
              echo "Skipping ${NAME} (already uploaded to GitHub release)"
              continue
            fi
            echo "Uploading ${NAME} to GitHub..."
            curl -sfS -X POST "${UPLOAD_URL}?name=${NAME}" \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}"
          done
