name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o dhcp-probe-linux-${{ matrix.goarch }} .

      - name: Upload build artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: dhcp-probe-linux-${{ matrix.goarch }}
          path: dhcp-probe-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all build artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: dist/release

      - name: Flatten artifacts into release dir
        run: |
          find dist/release -mindepth 2 -type f -exec mv {} dist/release/ \;
          find dist/release -maxdepth 1 -mindepth 1 -type d -exec rm -rf {} +

      - name: Create release and upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          API_BASE: ${{ env.GITHUB_SERVER_URL }}/api/v1
          REPO: ${{ github.repository }}
        run: |
          # Create the release
          RELEASE=$(curl -sf -X POST "${API_BASE}/repos/${REPO}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${TAG}\", \"name\": \"${TAG}\"}")
          RELEASE_ID=$(echo "$RELEASE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          # Upload each binary
          for f in dist/release/*; do
            curl -sf -X POST "${API_BASE}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename $f)" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}"
          done
