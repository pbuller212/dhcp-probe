name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o dhcp-probe-linux-${{ matrix.goarch }} .

      - name: Upload build artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: dhcp-probe-linux-${{ matrix.goarch }}
          path: dhcp-probe-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download amd64 artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dhcp-probe-linux-amd64
          path: dist/release

      - name: Download arm64 artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dhcp-probe-linux-arm64
          path: dist/release

      - name: Create release and upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          API_BASE="${SERVER_URL}/api/v1"

          echo "Files in dist/release:"
          ls -la dist/release/

          # Create the release
          RELEASE=$(curl -sf -X POST "${API_BASE}/repos/${REPO}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${TAG}\", \"name\": \"${TAG}\"}")
          echo "Release response: ${RELEASE}"
          RELEASE_ID=$(echo "$RELEASE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          echo "Release ID: ${RELEASE_ID}"

          # Upload each binary
          for f in dist/release/*; do
            echo "Uploading ${f}..."
            curl -sf -X POST "${API_BASE}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "${f}")" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}"
          done
